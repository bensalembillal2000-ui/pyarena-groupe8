[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyarena"
version = "0.1.0"
description = "Moteur de simulation stochastique pour combats d'arènes"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Billal Bensalem", email = "billal.bensalem@etu.umontpellier.fr" },
    { name = "Mohammed Derfoufi", email = "mohammed.derfoufi@etu.umontpellier.fr" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
pyarena = "pyarena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]